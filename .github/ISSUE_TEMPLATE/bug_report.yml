name: Report a lab problem
description: Setup errors, incorrect checks or documentation problems
body:
  - type: markdown
    attributes:
      value: "Use synthetic examples only. Do not share customer data or credentials. Add [SPOILER] to the title if you reveal a solution."
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and Python version
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and command
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected and actual behavior
      description: Include error text with sensitive information removed.
    validations:
      required: true
